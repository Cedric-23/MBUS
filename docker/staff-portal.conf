ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/StaffPortal
    DirectoryIndex index.php

    # StaffPortal contains the public login, registration, reset, and health wrappers.
    <Directory /var/www/html/StaffPortal>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Keep shared application files available to PHP includes while denying direct
    # requests except for the specific resources aliased below.
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all denied
        php_value auto_prepend_file "/var/www/html/Includes/session_boot.php"
        php_value include_path ".:/var/www/html:/var/www/html/Operator:/var/www/html/Conductor:/usr/local/lib/php"

        <FilesMatch "^(terms|privacy|avatar|id_image|gps|logout)\.php$">
            Require all granted
        </FilesMatch>
    </Directory>

    Alias /Assets/ /var/www/html/Assets/
    Alias /Operator/ /var/www/html/Operator/
    Alias /Conductor/ /var/www/html/Conductor/
    Alias /terms.php /var/www/html/terms.php
    Alias /privacy.php /var/www/html/privacy.php
    Alias /avatar.php /var/www/html/avatar.php
    Alias /id_image.php /var/www/html/id_image.php
    Alias /gps.php /var/www/html/gps.php
    Alias /logout.php /var/www/html/logout.php
    Alias /api/live_tracking.php /var/www/html/api/live_tracking.php
    Alias /api/gcash_sms_webhook.php /var/www/html/api/gcash_sms_webhook.php

    <Directory /var/www/html/Assets>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/Operator>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/Conductor>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/api>
        Options -Indexes
        AllowOverride None
        Require all denied
        <Files "live_tracking.php">
            Require all granted
        </Files>
        <Files "gcash_sms_webhook.php">
            Require all granted
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
